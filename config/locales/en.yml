# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  app_name: Desk

  helpers:
    cancel: Cancel

  activerecord:
    models:
      user:
        one: User
        other: Users
      project:
        one: Project
        other: Projects
    attributes:
      user:
        name: Name
        email: Email
        created_at: Created
        updated_at: Updated
      project:
        name: Name
        status: Status
        description: Description
        user: Owner
        updated_at: Updated
    values:
      project:
        status:
          idea: Idea
          active: Active
          paused: Paused
          done: Done

  # Palette entries. A parameterless GET route shows up once it has a label here.
  commands:
    groups:
      open: Open
      desk: Desk
    routes:
      users:
        index: Users
        new: New user
      projects:
        index: Projects
        new: New project
      dashboards:
        show: Dashboard
    desk:
      overview: Toggle overview
      new_workspace: New workspace
      cycle_width: Cycle column width
      full_width: Toggle full-width column
      center_column: Center column
      close_window: Close window

  desk:
    menubar:
      workspaces: Workspaces
      search: Search or run a command…
    statusbar:
      columns: Columns
      hint_html: "<kbd>⌘K</kbd> commands · <kbd>⌥←→↑↓</kbd> focus · <kbd>⌥⇧</kbd> + arrows move · <kbd>⌥[</kbd> <kbd>⌥]</kbd> stack / unstack · <kbd>⌥R</kbd> width · <kbd>⌥F</kbd> full · <kbd>⌥O</kbd> overview · <kbd>⌥W</kbd> close"
    wallpaper:
      title: Nothing open
      hint_html: "Press <kbd>⌘K</kbd> and type what you need — <em>new user</em>, <em>projects</em>, <em>dashboard</em>."
    palette:
      label: Command palette
      placeholder: Type a command or search…
      empty: Nothing matches.
      hint_html: "<kbd>↵</kbd> open · <kbd>⇧↵</kbd> in a new window · <kbd>esc</kbd> close"
    window:
      back: Back
      detach: Open in a new tab
      close: Close
      load_error: This page couldn't be shown in a window. Open it in a new tab (↗) to see what went wrong.

  users:
    index:
      title: Users
      new: New user
      empty: No users yet.
      count:
        one: 1 user
        other: "%{count} users"
    show:
      edit: Edit
      destroy: Delete
      confirm: Delete this user and all their projects?
      new_project: New project
      empty: No projects yet.
    new:
      title: New user
    edit:
      title: Edit user

  projects:
    index:
      title: Projects
      new: New project
      empty: No projects yet.
      count:
        one: 1 project
        other: "%{count} projects"
    show:
      edit: Edit
      destroy: Delete
      confirm: Delete this project?
    new:
