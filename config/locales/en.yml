# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  app_name: Desk

  helpers:
    cancel: Cancel

  activerecord:
    models:
      user:
        one: User
        other: Users
      project:
        one: Project
        other: Projects
      service:
        one: Service
        other: Services
    attributes:
      user:
        name: Name
        email: Email
        created_at: Created
        updated_at: Updated
      project:
        name: Name
        status: Status
        description: Description
        user: Owner
        updated_at: Updated
      service:
        name: Name
        user: Owner
        repository: Repository
        branch: Branch
        region: Region
        size: Size
        replicas: Replicas
        autoscale: Autoscale
        health_check_path: Health check path
        environment: Environment
        notes: Notes
        updated_at: Updated
    values:
      project:
        status:
          idea: Idea
          active: Active
          paused: Paused
          done: Done
      service:
        size:
          small: Small · 1 vCPU
          medium: Medium · 2 vCPU
          large: Large · 4 vCPU
    errors:
      models:
        service:
          attributes:
            name:
              invalid: may only contain lowercase letters, digits and dashes
            environment:
              assignments: "has lines that aren't KEY=value: %{lines}"

  rori:
    commands:
      # ⌘K entries. A parameterless GET route shows up once it has a label here.
      routes:
        users:
          index: Users
          new: New user
        projects:
          index: Projects
          new: New project
        dashboards:
          show: Dashboard
        services:
          index: Services
          new: New service

  users:
    index:
      title: Users
      new: New user
      empty: No users yet.
      count:
        one: 1 user
        other: "%{count} users"
    show:
      edit: Edit
      destroy: Delete
      confirm: Delete this user and all their projects?
      new_project: New project
      empty: No projects yet.
    new:
      title: New user
    edit:
      title: Edit user

  projects:
    index:
      title: Projects
      new: New project
      empty: No projects yet.
      count:
        one: 1 project
        other: "%{count} projects"
    show:
      edit: Edit
      destroy: Delete
      confirm: Delete this project?
    new:
      title: New project
    edit:
      title: Edit project

  services:
    index:
      title: Services
      new: New service
      empty: No services yet.
      count:
        one: 1 service
        other: "%{count} services"
    show:
      edit: Edit
      destroy: Delete
      confirm: Delete this service?
      replicas:
        one: 1 replica
        other: "%{count} replicas"
      replicas_autoscaled:
        one: up to 1 replica, autoscaled
        other: up to %{count} replicas, autoscaled
    new:
      title: New service
    edit:
      title: Edit %{name}
    form:
      source: Source
      runtime: Runtime
      health: Health check
      environment: Environment
      notes: Notes

  dashboards:
    show:
      title: Dashboard
      recent: Recently updated
