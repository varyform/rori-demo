# The desk's own copy. App-specific palette labels (desk.commands.routes)
# stay in the app's locale files.
en:
  desk:
    commands:
      groups:
        open: Open
        desk: Desk
      actions:
        overview: Toggle overview
        reopen_window: Reopen closed window
        new_workspace: New workspace
        cycle_width: Cycle column width
        full_width: Toggle full-width column
        center_column: Center column
        close_window: Close window
      workspaces:
        move: Move column to workspace…
        group: Workspace
        new: New workspace
      themes:
        pick: Pick theme…
        default: Default
        auto: Follows system
        dark: Dark
        light: Light
    menubar:
      workspaces: Workspaces
      search: Search or run a command…
    statusbar:
      columns: Columns
      # %{mod} is Desk.modifier's symbol (⌥, ⌘ or ⌃).
      hint_html: "<kbd>⌘K</kbd> commands · <kbd>%{mod}←→↑↓</kbd> focus · <kbd>%{mod}1–9</kbd> workspace · <kbd>%{mod}⇧</kbd> + arrows / 1–9 move · <kbd>%{mod}[</kbd> <kbd>%{mod}]</kbd> stack / unstack · <kbd>%{mod}R</kbd> width · <kbd>%{mod}F</kbd> full · <kbd>%{mod}O</kbd> overview · <kbd>%{mod}W</kbd> close · <kbd>%{mod}⇧T</kbd> reopen · <kbd>esc</kbd> leave field"
    wallpaper:
      title: Nothing open
      hint_html: "Press <kbd>⌘K</kbd> to open a page or run a command."
    palette:
      label: Command palette
      placeholder: Type a command or search…
      empty: Nothing matches.
      hint_html: "<kbd>↵</kbd> open · <kbd>⇧↵</kbd> in a new window · <kbd>⌫</kbd> back · <kbd>esc</kbd> close"
    window:
      back: Back
      detach: Open in a new tab
      close: Close
      armed: keys → here
      typing: "<input>"
      discard: This window has unsaved changes. Close it anyway?
      load_error: This page couldn't be shown in a window. Open it in a new tab (↗) to see what went wrong.
